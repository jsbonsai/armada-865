# SM8250 RetroidPocket: disable WirePlumber auto-ALSA nodes entirely.
# They open wrong channel counts (7ch) and wedge the Qualcomm ADSP.
# sm8250-audio-init loads the only sink: module-alsa-sink on plughw:0,1.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
