# Enable UCM profile/port selection for Qualcomm SM8250 Retroid handhelds.
# Stock WirePlumber sets api.acp.auto-profile=false globally; without this override
# the RetroidPocket card stays on Dummy Output.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = true
        api.acp.auto-port = true
      }
    }
  }
]
