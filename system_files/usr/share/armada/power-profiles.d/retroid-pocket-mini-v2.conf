# armada-device-fan v2 retroid-pocket-mini-v2
# Installed by sm8250-bringup-early.sh (setup_power) to /etc/armada/power-profiles.conf
# on Retroid Pocket Mini V2 only. Merged over /usr/share/armada/power-profiles.conf;
# only the sections below are overridden. Bump the version stamp on the first line
# to force reinstall on already-provisioned devices.
#
# Design + adversarial review: docs/notes/fan-curve-duel-2026-07-27 (private repo).
# Calibration: live Mini V2 telemetry 2026-07-27 — idle 39C hums at the factory
# pwm-51 floor; DMC4 control-temp (top-3-hottest mean, what powerd consumes)
# reads 66-71C in-game; download peak 82C. Plateaus sit on the measured bands so
# the fan holds ONE speed through gameplay (no hunting); onsets carry 3C+ margin
# above measured Steam-home equilibrium (~55C displayed / ~58C control) so the
# fan is fully OFF at idle and never limit-cycles at the threshold. 1C-wide
# off->on steps exploit integer-temp interpolation: the fan never dwells at
# stall-risk crawl duties (no tach on this fan). Kernel tsens trips remain the
# independent seized-fan backstop.

[fan]
min_pwm=0
max_pwm=255
ramp_up=36
ramp_down=6
smoothing=0.50
pwm_quantum=8

[suspend]
fan_safe_above=55
fan_low_pwm=0
fan_safe_pwm=128

[fan_curve.relaxed]
label=Relaxed
curve=98:255,94:208,88:152,82:104,76:72,66:48,60:48,59:0,0:0

[fan_curve.moderate]
label=Moderate
curve=96:255,90:208,82:136,78:88,65:88,60:48,59:48,58:0,0:0

[fan_curve.aggressive]
label=Aggressive
curve=90:255,85:208,80:152,78:112,64:112,60:80,56:64,55:0,0:0
