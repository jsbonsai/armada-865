ARMADA_DEVICE_ID=retroid-pocket-mini-v2
ARMADA_DEVICE_NAME='Retroid Pocket Mini V2'
ARMADA_SOC_CLASS=SM8250

# Near-square 1080x1240 ch13726a,rpminiv2 panel. Orientation/height/touch were
# hardware-validated on the device (rpminiv2 DTB drops panel rotation; gamescope
# rotates via the shader with orientation=right for an upright landscape image).
ARMADA_PRIMARY_CONNECTOR=DSI-1
ARMADA_PANEL_ORIENTATION=right
ARMADA_PANEL_NATIVE_WIDTH=1080
ARMADA_PANEL_NATIVE_HEIGHT=1240
ARMADA_PANEL_REFRESH_RATES=60
ARMADA_GAMESCOPE_USE_ROTATION_SHADER=1
# Panel has no EDID; without a physical size gamescope makes Steam compute a
# ~3.1x auto-scale (giant, cut-off UI). ~3.9" 1080x1240 panel ≈ 75x65mm as held.
ARMADA_GAMESCOPE_FAKE_OUTPUT_MM=75x65
# FAKE_OUTPUT_MM alone did NOT tame Steam's auto interface scale — it still
# maxes out on the near-square canvas. steam-ui-scale applies this manual
# factor once per install instead. 1.45 matches the Deck's CSS width on the
# 1240x1080 steamui canvas: 1240/1.45 ≈ 855 vs the Deck's 1280/1.5 ≈ 853,
# with the extra vertical room left to the content.
ARMADA_STEAM_UI_SCALE=1.45
ARMADA_GPU_GAME_FLOOR_MHZ=490
