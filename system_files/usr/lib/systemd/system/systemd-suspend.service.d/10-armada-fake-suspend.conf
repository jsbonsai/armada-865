[Unit]
Description=Armada suspend selector (real s2idle when /etc/armada/suspendmode.real, else fake-suspend)

[Service]
# suspend-select routes to real systemd-sleep (s2idle) or fake-suspend based on
# the /etc/armada/suspendmode.real toggle. Both paths block until woken.
ExecStart=
ExecStart=/usr/libexec/armada/suspend-select
TimeoutStartSec=infinity
