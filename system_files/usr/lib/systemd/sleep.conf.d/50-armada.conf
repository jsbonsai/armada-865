# SM8250 has no PSCI "mem" (S3) state — s2idle "freeze" is the only real
# suspend path. Force it so `systemctl suspend` never tries (and hangs on) mem.
# Only consulted on the REAL path (systemd-sleep); the fake-suspend fallback
# bypasses systemd-sleep entirely, so this is inert until real s2idle is toggled
# on via /etc/armada/suspendmode.real (see usr/libexec/armada/suspend-select).
[Sleep]
AllowSuspend=yes
SuspendState=freeze
