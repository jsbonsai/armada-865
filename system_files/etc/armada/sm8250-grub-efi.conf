[Service]
# SM8250 GRUB/EFI (D1): GRUB loads a raw ARM64 Image from /KERNEL — an Android
# bootimg there breaks boot ("plain image kernel not supported").
# Clear inherited ExecStop first: without the empty assignment, systemd APPENDS
# this ExecStop after the base unit's legacy bootimg writer (and its
# `|| bootc rollback`), so /KERNEL still gets corrupted at every shutdown.
ExecStop=
ExecStop=/bin/sh -c 'test -x /etc/armada/armada-grub-efi-update && exec /etc/armada/armada-grub-efi-update; echo "armada-bootimg-sync: missing /etc/armada/armada-grub-efi-update — refusing bootimg write" >&2; exit 0'
