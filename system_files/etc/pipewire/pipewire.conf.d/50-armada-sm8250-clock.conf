# SM8250: reduce XRUN probability on the q6asm speaker PCM.
# - Pin the graph rate: rate switching closes/reopens the ALSA device, and the
#   q6asm driver historically wedged the ADSP on close/reopen cycles.
# - Raise the minimum quantum: game-launch CPU spikes starve the audio thread;
#   tiny quanta (with PLAYBACK_MIN_PERIOD_SIZE=8 from the ROCKNIX periods
#   patch) make underruns near-certain under load.
context.properties = {
    default.clock.rate        = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.min-quantum = 512
}
