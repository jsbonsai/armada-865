[Service]
# SM8250 GRUB/EFI path: never fall back to legacy bootimg writer (corrupts /KERNEL).
ExecStop=/bin/sh -c 'if [ -f /boot/efi/EFI/BOOT/grub.cfg ] || [ -f /boot/efi/boot/grub/grub.cfg ]; then /etc/armada/armada-grub-efi-update || /usr/libexec/armada/armada-grub-efi-update || true; else /etc/armada/armada-bootimg-update || /usr/libexec/armada/armada-bootimg-update || bootc rollback; fi'
