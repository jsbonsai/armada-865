---
name: Build container image
on:
  pull_request:
    branches:
      # sm8250 is the default branch — without it here, PRs targeting the trunk
      # (e.g. dependabot) got no CI at all. main kept for upstream-sync PRs.
      - main
      - sm8250
  push:
    branches:
      # main removed: it is only an upstream-sync staging branch, and its pushes
      # can never publish (the push step gates on default-branch/sm8250) — each
      # one just burned a ~25 min ARM build. Validate sync branches by
      # dispatching this workflow on them instead (validation mode below).
      - sm8250
    paths-ignore:
      # Docs, release notes, and workflow edits don't change the image — skip the
      # ~20min container build for them (also avoids a signing-gate red-X on
      # non-default-branch doc pushes). Trigger builds manually via workflow_dispatch.
      - '**.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build. Leave empty to use the workflow ref."
        type: string
        default: ""

env:
  IMAGE_DESC: "Armada: a gaming-focused, SteamOS-like Fedora bootc image for ARM64 handhelds"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  # Every push to sm8250 publishes the "testing" channel; beta/stable are made by
  # promoting (retagging) a testing build via promote.yml — no rebuild.
  DEFAULT_TAG: "testing"

concurrency:
  # inputs.branch keeps manual branch builds out of the push group (empty on
  # push/PR events, so those group purely by ref as before). Stale
  # brand_name/stream_name inputs (ublue template residue) removed.
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.branch }}
  # Cancel superseded runs on push only: each push re-pushes AND re-signs the
  # same :testing tag, so a run cancelled between "pushed" and "signed" is
  # healed by the run that replaced it (devices merely refuse the briefly
  # unsigned image and retry — bootc fails closed). Manual dispatches and PRs
  # are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Resolve manual build ref
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          branch="${INPUT_BRANCH}"
          if [ -z "${branch}" ]; then
            exit 0
          fi
          branch="${branch#refs/heads/}"
          if ! [[ "${branch}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Branch '${branch}' cannot be used as a matching container tag. Use letters, numbers, dots, underscores, or dashes."
            exit 1
          fi

          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Ensure container tools
        run: |
          set -euxo pipefail
          # ubuntu-24.04 dropped these from the runner image; the build action,
          # rechunk, and push all need them.
          need=""
          for t in buildah podman skopeo; do
            command -v "$t" >/dev/null || need="$need $t"
          done
          [ -z "$need" ] || { sudo apt-get update && sudo apt-get install -y $need; }

      - name: Require signing key before publishing a channel
        # Must mirror the Push step's condition exactly: fail early ONLY when
        # this run will actually publish. A validation dispatch on a
        # non-publishing ref (or a fork without the secret) must sail past this
        # and finish green.
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
           github.ref == 'refs/heads/sm8250')
        run: |
          if [ -z "${{ secrets.SIGNING_SECRET }}" ]; then
            echo "::error::SIGNING_SECRET is not set — refusing to publish an unsigned image (devices verify ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }})."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.manual.outputs.branch || github.ref }}

      - name: Check build recipes
        uses: ublue-os/just-action@30ab4659369934b65b655bf8d2fa4ddd6547d384 # v3

      - name: Get image version
        id: version
        run: |
          echo "created=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT
          echo "version=$(TZ=America/New_York date +%Y%m%d).$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          # Manual branch builds tag as :<branch> so they never touch the
          # :testing OTA channel; normal pushes keep publishing :testing.
          tags: |
            type=raw,value=${{ steps.manual.outputs.branch || env.DEFAULT_TAG }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.created=${{ steps.version.outputs.created }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: raw
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            ARMADA_VERSION=${{ steps.version.outputs.version }}
          oci: false

      - name: Rechunk for small OTA deltas
        id: rechunk
        run: |
          set -euxo pipefail
          # Ubuntu 24.04 blocks the unprivileged user namespaces rootless skopeo needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # build-chunked-oci runs rpm-ostree from inside the image against root
          # containers-storage, so bridge the rootless-built image over first.
          skopeo copy "containers-storage:localhost/${IMAGE_NAME}:raw" oci-archive:/tmp/raw.tar
          sudo skopeo copy oci-archive:/tmp/raw.tar containers-storage:localhost/raw-img
          # Free disk before the encapsulate; both are unused once raw-img exists.
          rm -f /tmp/raw.tar
          podman rmi "localhost/${IMAGE_NAME}:raw" 2>/dev/null || true
          sudo podman run --rm --privileged \
            --volume /var/lib/containers:/var/lib/containers \
            localhost/raw-img \
            rpm-ostree compose build-chunked-oci --bootc --max-layers 127 \
            --format-version 2 \
            --from localhost/raw-img --output containers-storage:localhost/chunked-img

      - name: Push to GHCR
        id: push
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
           github.ref == 'refs/heads/sm8250')
        run: |
          set -euxo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          # One image, many tags → one digest, so one signature (below) covers all.
          # Retry so a transient ghcr 5xx can't leave a tag pushed but unsigned.
          push_tag() {
            local n=0
            until sudo skopeo copy \
                  containers-storage:localhost/chunked-img "docker://${IMAGE_FULL}:$1"; do
              n=$((n + 1)); [ "${n}" -ge 3 ] && return 1; sleep 15
            done
          }
          first=""
          for tag in ${{ steps.metadata.outputs.tags }}; do
            push_tag "${tag}"
            [ -n "${first}" ] || first="${tag}"
          done
          # skopeo --digestfile can't write under sudo's userns remap; read it back.
          digest=$(sudo skopeo inspect --format '{{.Digest}}' "docker://${IMAGE_FULL}:${first}")
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      # Sign gating (and Install Cosign below) keys off the ONE fact that
      # matters — "did the Push step actually produce a digest?" — instead of
      # re-deriving ref conditions by hand. This is what fixes the
      # validation-build failure (run 30196668732): a branch copy of this file
      # once dropped the ref gate from Sign but not Push, so cosign was handed
      # 'ghcr.io/...@' (empty digest). With the digest gate the two steps can
      # never disagree, on any ref, in any future branch copy.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.push.outputs.digest != '' && env.HAVE_SIGNING_SECRET == 'true'
        env:
          HAVE_SIGNING_SECRET: ${{ secrets.SIGNING_SECRET != '' }}
        with:
          cosign-release: 'v2.6.3'

      - name: Sign container image
        if: steps.push.outputs.digest != '' && env.HAVE_SIGNING_SECRET == 'true'
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          # cosign runs rootless and has its own auth store — the push step's
          # `sudo skopeo login` only authenticated root, so log cosign in too.
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Sign the digest, not a tag (a concurrent run could re-point the tag).
          # --new-bundle-format=false: bootc's verifier expects the legacy .sig; the
          # default flips in cosign v3.
          cosign sign -y --new-bundle-format=false --key env://COSIGN_PRIVATE_KEY "${IMAGE_FULL}@${{ steps.push.outputs.digest }}"
        env:
          HAVE_SIGNING_SECRET: ${{ secrets.SIGNING_SECRET != '' }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          # Key is encrypted with an empty passphrase; without this cosign
          # prompts on a TTY-less runner and the step hangs/fails.
          COSIGN_PASSWORD: ""

      - name: Validation-only summary
        # No digest ⇒ nothing was published (PR, or a dispatch on a
        # non-publishing ref). Say so loudly so a green validation run is never
        # mistaken for an OTA publish.
        if: steps.push.outputs.digest == ''
        run: |
          {
            echo "### Validation build — not published"
            echo ""
            echo "Image built and rechunked successfully on \`${GITHUB_REF}\`,"
            echo "but push/sign were skipped: only pushes to the default branch"
            echo "or \`sm8250\` publish the \`:${DEFAULT_TAG}\` OTA channel."
          } >> "$GITHUB_STEP_SUMMARY"
